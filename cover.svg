<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <!-- stop offset="100%" stop-color="#1e293b"/ -->
      <stop offset="100%" stop-color="#687888"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Abstract Vector Nodes (Decorative) -->
  <!-- circle cx="1150" cy="150" r="150" fill="#38bdf8" opacity="0.05"/ -->
  <!-- circle cx="1050" cy="500" r="200" fill="#818cf8" opacity="0.05"/ -->
  <circle cx="1150" cy="150" r="150" fill="#08e8f8" opacity="0.05"/>
  <circle cx="1050" cy="500" r="200" fill="#acbcf8" opacity="0.05"/>
  <path d="M 100 500 Q 400 100 1200 400" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.08"/>
  
  <!-- Main Title -->
  <text x="160" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Knowledge Base
  </text>
  <text x="160" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="url(#accent)" letter-spacing="-1">
    Service (KBS)
  </text>
  
  <!-- Subtitle (Split into 2 lines to prevent overlap) -->
  <text x="160" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#94a3b8" font-weight="500">
    <tspan x="160" dy="0">Микросервис</tspan>
    <tspan x="160" dy="38">для управления векторными базами знаний</tspan>
  </text>
  
  <!-- Tech Stack Badges -->
  <g transform="translate(160, 450)" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f8fafc" text-anchor="middle">
    <!-- FastAPI -->
    <rect x="0" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="60" y="26">FastAPI</text>
    
    <!-- Qdrant -->
    <rect x="150" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="210" y="26">Qdrant</text>
    
    <!-- Docker -->
    <rect x="300" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="360" y="26">Docker</text>
    
    <!-- Prometheus -->
    <rect x="450" y="0" width="160" height="40" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="530" y="26">Prometheus</text>
    
    <!-- Grafana -->
    <rect x="640" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="700" y="26">Grafana</text>

    <!-- Loki (NEW) -->
    <rect x="790" y="0" width="100" height="40" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="840" y="26">Loki</text>
  </g>
  
  <!-- Key Features (Right side, shifted to prevent any overlap) -->
  <g transform="translate(820, 220)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">
    <text x="0" y="0" fill="#38bdf8">🔒 Strict Multi-Tenancy</text>
    <text x="0" y="60" fill="#38bdf8">🧠 Auto-Calibration</text>
    <text x="0" y="120" fill="#38bdf8">🗄️ Unified Qdrant Storage</text>
    <text x="0" y="180" fill="#38bdf8">📊 Full Observability</text>
  </g>
</svg>
